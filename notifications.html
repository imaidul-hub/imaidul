<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>নোটিফিকেশন</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7a4a">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#17241c;--mu:#62736a;--pr:#0f7a4a;--pr2:#0b5c37;--bd:#dbe7df;--new:#e8f5ee;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16231b;--tx:#e6f0ea;--mu:#94a89c;--pr:#34b57a;--pr2:#0b5c37;--bd:#254033;--new:#1b3326}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.app{min-height:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column}
.bar{flex:none;position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.bar b{font-size:17px;flex:1;min-width:0}
.bar .lk{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.gate{margin:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.tools .mu{color:var(--mu);font-size:13px}
.tools button{background:none;border:1px solid var(--pr);color:var(--pr);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tools button:disabled{opacity:.4}
#list{padding:0 10px calc(16px + env(safe-area-inset-bottom,0px))}
.day{color:var(--mu);font-size:12px;font-weight:700;margin:12px 4px 6px}
.n{position:relative;display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.n.un{background:var(--new);border-color:var(--pr);border-left-width:5px}
.n:active{opacity:.85}
.ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.nb{flex:1;min-width:0}
.nt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nt b{font-size:15px}
.n.un .nt b{font-weight:800}
.bd{flex:none;background:var(--er);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;line-height:18px}
.tx{color:var(--tx);font-size:14px;margin-top:2px;word-break:break-word;white-space:pre-wrap}
.tm{color:var(--mu);font-size:12px;margin-top:4px}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <b>🔔 নোটিফিকেশন</b>
    <a class="lk" href="index.html">হোম</a>
  </div>

  <div id="gate" class="gate hide"></div>

  <div id="main" class="hide">
    <div class="tools">
      <span class="mu" id="cnt"></span>
      <button id="allBtn" onclick="markAll()">সব পঠিত করুন</button>
    </div>
    <div id="list"><div class="empty">লোড হচ্ছে...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCDjI1t2EnJKmvAV3hbz-sjir8YW8IfOQg",
  authDomain: "mmmmg-d02b8.firebaseapp.com",
  projectId: "mmmmg-d02b8",
  storageBucket: "mmmmg-d02b8.firebasestorage.app",
  messagingSenderId: "1001193607775",
  appId: "1:1001193607775:web:c4539574a49cddf59341ea"
});
const auth = firebase.auth(), db = firebase.firestore();
try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}

// ── এই ডিভাইসের FCM টোকেন শিক্ষকের আইডির সাথে সংরক্ষণ (messages.html এর মতোই) ──
let fcmTok = '';
function saveToken(){
  try {
    const u = auth.currentUser;
    if (!fcmTok || !u || !me) return;
    db.collection('fcmTokens').doc(fcmTok).set({
      token: fcmTok, teacherId: me.id, uid: u.uid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(() => {});
  } catch (e) {}
}
window.onFcmToken = t => { fcmTok = t || ''; saveToken(); };
try { if (window.AndroidPrint && AndroidPrint.getFcmToken) window.onFcmToken(AndroidPrint.getFcmToken()); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const ms = ts => ts && ts.toMillis ? ts.toMillis() : Date.now();
const hm = t => new Date(t).toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
function dayLbl(t){
  const d = new Date(t), n = new Date(), y = new Date(); y.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return 'আজ';
  if (d.toDateString() === y.toDateString()) return 'গতকাল';
  return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
}
const normPhone = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('880')) d = d.slice(3); if (d.length === 10 && d[0] === '1') d = '0' + d; return d; };

let teachers = [], me = null, items = [], unsubT = null, unsubN = null;
function findMe(u){
  const ph = normPhone((u.email || '').split('@')[0]);
  return ph ? (teachers.find(t => normPhone(t.phone) === ph) || null) : null;
}
function gate(msg){
  $('main').classList.add('hide');
  $('gate').classList.remove('hide'); $('gate').innerHTML = msg;
}

auth.onAuthStateChanged(u => {
  [unsubT, unsubN].forEach(f => f && f()); unsubT = unsubN = null;
  me = null; items = [];
  if (!u) { gate('নোটিফিকেশন দেখতে লগইন করুন। <a href="index.html" style="color:var(--pr);font-weight:700">লগইন পেজে যান</a>'); return; }
  unsubT = db.collection('teachers').onSnapshot(s => {
    teachers = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const first = !me;
    me = findMe(u);
    if (!me) { gate('আপনার অ্যাকাউন্ট শিক্ষক তালিকার সাথে মেলেনি, তাই নোটিফিকেশন দেখা যাচ্ছে না।'); return; }
    $('gate').classList.add('hide'); $('main').classList.remove('hide');
    saveToken();
    if (first) {
      unsubN = db.collection('notifications').where('teacherId', '==', me.id).onSnapshot(q => {
        items = q.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, () => { $('list').innerHTML = '<div class="empty">নোটিফিকেশন লোড করা যায়নি।</div>'; });
    }
  }, () => gate('শিক্ষক তালিকা লোড করা যায়নি।'));
});

function icon(t){
  const s = String(t || '');
  const m = s.match(/^\s*(\S+)/);
  return m && !/^[A-Za-z0-9\u0980-\u09FF]/.test(m[1]) ? m[1] : '🔔';
}
function titleOnly(t){ return String(t || '').replace(/^\s*[^A-Za-z0-9\u0980-\u09FF\s]+\s*/, ''); }

function render(){
  const list = items.slice().sort((a, b) => ms(b.ts) - ms(a.ts));
  const un = list.filter(x => !x.read).length;
  $('cnt').textContent = list.length ? (un ? bn(un) + 'টি নতুন • মোট ' + bn(list.length) + 'টি' : 'মোট ' + bn(list.length) + 'টি') : '';
  $('allBtn').disabled = !un;
  if (!list.length) { $('list').innerHTML = '<div class="empty">এখনো কোনো নোটিফিকেশন নেই।</div>'; return; }
  let html = '', last = '';
  list.forEach(x => {
    const t = ms(x.ts), dl = dayLbl(t);
    if (dl !== last) { html += '<div class="day">' + esc(dl) + '</div>'; last = dl; }
    html += '<div class="n' + (x.read ? '' : ' un') + '" onclick="readOne(\'' + String(x.id).replace(/[^A-Za-z0-9]/g, '') + '\')">' +
      '<div class="ic">' + esc(icon(x.title)) + '</div>' +
      '<div class="nb"><div class="nt"><b>' + esc(titleOnly(x.title)) + '</b>' + (x.read ? '' : '<span class="bd">নতুন</span>') + '</div>' +
      '<div class="tx">' + esc(x.body) + '</div><div class="tm">' + esc(hm(t)) + '</div></div></div>';
  });
  $('list').innerHTML = html;
}

function readOne(id){
  const x = items.find(v => v.id === id);
  if (!x || x.read) return;
  x.read = true; render();
  db.collection('notifications').doc(id).update({ read: true }).catch(() => {});
}
function markAll(){
  const un = items.filter(x => !x.read);
  if (!un.length) return;
  un.forEach(x => { x.read = true; });
  render();
  const b = db.batch();
  un.slice(0, 450).forEach(x => b.update(db.collection('notifications').doc(x.id), { read: true }));
  b.commit().catch(() => {});
}
</script>
</body>
</html>
