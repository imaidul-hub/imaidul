<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষকবৃন্দ</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#17241c;--mu:#62736a;--pr:#0f7a4a;--pr2:#0b5c37;--gd:#c9a227;--bd:#dbe7df}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16231b;--tx:#e6f0ea;--mu:#94a89c;--pr:#34b57a;--pr2:#0b5c37;--bd:#254033}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}
.bar{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.bar a{background:rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.cnt{margin:8px 2px;color:var(--mu);font-size:13px}
.t{flex-wrap:wrap;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.av{width:46px;height:46px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.in{flex:1;min-width:0}
.in b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.acts a{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;text-decoration:none}
.call{background:var(--pr)}.wa{background:#25d366}.off{background:var(--mu);opacity:.5;pointer-events:none}
.ab{display:inline-block;margin-top:2px;padding:0 8px;border-radius:999px;font-size:12px;background:rgba(220,38,38,.12);color:#dc2626;border:1px solid rgba(220,38,38,.35)}
.ab.p{background:rgba(15,122,74,.12);color:var(--pr);border-color:rgba(15,122,74,.35)}
.tgs{display:flex;flex-wrap:wrap;gap:4px}
.ab.z{background:rgba(15,122,74,.12);color:var(--pr);border-color:rgba(15,122,74,.35)}
.yr{display:flex;align-items:center;gap:8px;margin:10px 0}
.yr b{flex:1;text-align:center}
.yr button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:16px 22px;font:inherit;font-size:16px;cursor:pointer}
.yr b{font-size:17px}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.ctl .yr{margin:0 0 10px}
.ctl .pbtn{margin-top:10px}
@media print{.ctl{display:none!important}}
.ab{cursor:pointer}
.mg{flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px dashed var(--bd);padding-top:10px}
.mg div{text-align:center;border:1px solid var(--bd);border-radius:10px;padding:4px 2px;font-size:12px;color:var(--mu)}
.mg div b{display:block;font-size:17px;color:var(--mu)}
.mg div.on{border-color:var(--bd);background:rgba(220,38,38,.06)}
.mg div span{display:block;font-size:13px}
.mg div span i{font-style:normal}
.mg .cm{color:#dc2626;font-weight:700}.mg .cp{color:var(--pr);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;padding:0 0 4px;border-bottom:2px solid var(--pr);color:var(--pr);font-weight:700;font-size:16px}
.sec span{font-size:13px;color:var(--mu);font-weight:500}
#ptbl{display:none}
@page{size:A4 portrait;margin:12mm 10mm}
.pbtn{font:inherit;padding:10px;border-radius:10px;border:0;background:var(--pr);color:#fff;width:100%;margin-top:8px;cursor:pointer;font-weight:700}

/* নতুন লেআউট: পদবি+ইন্ডেক্স এক সারি, ফোন এক সারি, নিচে মিস/প্রক্সি/কল এক সারি */
.in .r1,.in .r2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--bd);padding-top:10px}
.bot .tgs{flex-wrap:wrap;flex:1;min-width:0}
.bot .ab{white-space:nowrap;margin-top:0}

@media print{
html,body{width:190mm;margin:0;padding:0}
.bar,.yr,#q,.pbtn,.cnt,#list{display:none!important}
.wrap{max-width:none;margin:0;padding:0}
body{background:#fff;color:#000;font-size:12px;line-height:1.35}
#ptbl{display:block!important;width:100%}
#ptbl table{width:100%;table-layout:fixed;border-collapse:collapse}
#ptbl th,#ptbl td{border:1px solid #000;padding:4px 3px;text-align:center;word-break:break-word;overflow-wrap:anywhere}
#ptbl th:nth-child(1),#ptbl td:nth-child(1){width:30%}
#ptbl th:nth-child(2),#ptbl td:nth-child(2){width:16%}
#ptbl th:nth-child(3),#ptbl td:nth-child(3){width:22%}
#ptbl th:nth-child(4),#ptbl td:nth-child(4){width:16%}
#ptbl th:nth-child(5),#ptbl td:nth-child(5){width:16%}
#ptbl td.l{text-align:left}
#ptbl thead{display:table-header-group}
#ptbl th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11px}
#ptbl tr{page-break-inside:avoid}
#ptbl tr.sh td{background:#d9d9d9;font-weight:700;text-align:left;font-size:12.5px;padding:5px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid;page-break-after:avoid}}
.hide{display:none!important}
.guest .ctl .yr,.guest .ctl .pbtn{display:none!important}
.rcb{flex-basis:100%;font:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:10px;border:1px solid var(--pr);background:transparent;color:var(--pr);cursor:pointer}
#rcm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:10px}
#rcm.show{display:block}
.rcc{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.rch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rch h3{margin:0;font-size:18px;color:var(--pr)}
.rcx{border:0;background:var(--bd);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.rcn{display:flex;align-items:center;gap:8px;margin:12px 0}
.rcn select{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.rcn button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.rcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.rcs div{text-align:center;border-radius:10px;padding:8px;font-size:13px}
.rcs b{display:block;font-size:22px}
.rcs .a{background:rgba(220,38,38,.1);color:#dc2626}.rcs .b{background:rgba(15,122,74,.12);color:var(--pr)}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th,.rt td{border:1px solid var(--bd);padding:6px 4px;text-align:center}
.rt th{background:rgba(15,122,74,.12)}
.rt td.l{text-align:left}
.rcc .empty{padding:14px;font-size:13px}
@media print{
#rcm{display:none!important}
body.rcp .bar,body.rcp .wrap,body.rcp #ptbl,body.rcp .rcno{display:none!important}
body.rcp #rcm{display:block!important;position:static;background:none;padding:0;overflow:visible}
body.rcp .rcc{border:0;border-radius:0;padding:0;background:#fff;color:#000;max-width:none}
body.rcp .rch h3{color:#000}
body.rcp .rcp-only{display:block!important}
body.rcp .rt th,body.rcp .rt td{border:1px solid #000;color:#000}
body.rcp .rt th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.rcp .rt tr{page-break-inside:avoid}
body.rcp .rcs div{border:1px solid #000;background:none;color:#000}
}

/* ===== শিক্ষকের রুটিন ===== */
#rtm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:10px}
#rtm.show{display:block}
.rtw{overflow-x:auto}
.rt.g{min-width:100%}
.rt.g th small{display:block;font-weight:400;color:var(--mu);font-size:11px;white-space:nowrap}
.rt.g td{min-width:84px;line-height:1.3}
.rt.g td small{display:block;color:var(--mu);font-size:11px}
.rt.g td.dn{font-weight:700;white-space:nowrap;background:rgba(15,122,74,.08)}
.rt.g tr.today td{background:rgba(201,162,39,.16)}
@page rtl{size:A4 landscape;margin:10mm}
@media print{
#rtm{display:none!important}
body.rtp,html:has(body.rtp){width:auto!important}
body.rtp .bar,body.rtp .wrap,body.rtp #ptbl,body.rtp .rcno{display:none!important}
body.rtp #rtm{display:block!important;position:static;background:none;padding:0;overflow:visible}
body.rtp #rtc{page:rtl;border:0;border-radius:0;padding:0;background:#fff;color:#000;max-width:none}
body.rtp .rch h3{color:#000}
body.rtp .rcp-only{display:block!important}
body.rtp .rtw{overflow:visible}
body.rtp .rt th,body.rtp .rt td{border:1px solid #000;color:#000}
body.rtp .rt th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.rtp .rt.g td.dn,body.rtp .rt.g tr.today td{background:none}
body.rtp .rt.g td small,body.rtp .rt.g th small{color:#333}
body.rtp .rcs div{border:1px solid #000;background:none;color:#000}
}
@media print{html{-webkit-filter:grayscale(1);filter:grayscale(1)}*,*::before,*::after{color:#000!important;text-shadow:none!important;box-shadow:none!important}.rt small,.mu{color:#333!important}}
</style>
</head>
<body>
<div class="bar"><b>👨‍🏫 শিক্ষকবৃন্দ</b><a href="index.html">হোম</a></div>

<div class="wrap">
  <div id="main">
  <div class="ctl">
  <div class="yr"><button onclick="shiftY(-1)">◀</button><b id="yl"></b><button onclick="shiftY(1)">▶</button></div>
  <input id="q" type="search" placeholder="🔍 নাম, বিষয় বা মোবাইল দিয়ে খুঁজুন" oninput="render()">
  <button class="pbtn" onclick="document.body.classList.remove('rcp','rtp');doPrint()">🖨️ সব শিক্ষকের তথ্য প্রিন্ট করুন</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <div id="ptbl"></div>
  <div id="list"><div class="empty">লোড হচ্ছে...</div></div>
  </div>
</div>

<div id="rcm" onclick="if(event.target===this)closeRC()"><div class="rcc" id="rcc"></div></div>
<div id="rtm" onclick="if(event.target===this)closeRT()"><div class="rcc" id="rtc"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
function doPrint(){ if (window.AndroidPrint && typeof AndroidPrint.print === 'function') AndroidPrint.print(); else window.print(); }
firebase.initializeApp({
  apiKey: "AIzaSyCDjI1t2EnJKmvAV3hbz-sjir8YW8IfOQg",
  authDomain: "mmmmg-d02b8.firebaseapp.com",
  projectId: "mmmmg-d02b8",
  storageBucket: "mmmmg-d02b8.firebasestorage.app",
  messagingSenderId: "1001193607775",
  appId: "1:1001193607775:web:c4539574a49cddf59341ea"
});
const db = firebase.firestore(), auth = firebase.auth();
const $ = id => document.getElementById(id);
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normPhone = p => { let d = String(p||'').replace(/\D/g,''); if (d.startsWith('880')) d = d.slice(3); if (d.length === 10 && d[0] === '1') d = '0' + d; return d; };
var teachers = [], missed = {}, openId = {}, Y = new Date().getFullYear();
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

// মোট ক্লাস মিস (অনুপস্থিত থাকায়) ও মোট প্রক্সি (অন্যের ক্লাস নেওয়ায়)
function absTag(id){
  if (!auth.currentUser) return `<div class="tgs"><span class="ab p" onclick="openRT('${id}')">📅 রুটিন</span></div>`;
  const a = missed[id], cls = a ? a.total : 0, px = a ? a.ptotal : 0;
  return `<div class="tgs"><span class="ab ${cls ? '' : 'z'}" onclick="openRC('${id}','m')">মিস: ${bn(cls)}টি</span><span class="ab p" onclick="openRC('${id}','p')">প্রক্সি: ${bn(px)}টি</span><span class="ab p" onclick="openRC('${id}','all')">📋 রিপোর্ট</span><span class="ab p" onclick="openRT('${id}')">📅 রুটিন</span></div>`;
}
function shiftY(n){ Y += n; loadMissed(); }
// ইনডেক্স নম্বরের সম্ভাব্য ফিল্ড
const INDEX_FIELDS = ['index','indexNo','indexNumber','idx','indexNum','teacherIndex'];
const idxOf = t => { for (const f of INDEX_FIELDS) if (t[f] !== undefined && t[f] !== '') return t[f]; return ''; };
// পদবির সম্ভাব্য ফিল্ড (না পেলে বিষয় দেখাবে)
const DESIG_FIELDS = ['designation','post','position','title','role','পদবি'];
const desigOf = t => { for (const f of DESIG_FIELDS) if (t[f]) return t[f]; return t.subject || ''; };

// ক্যাটাগরি: পদবি দেখে ভাগ করা হয় (বানানের ছোটখাটো ভিন্নতা ধরবে)
const CATS = ['অধ্যক্ষ', 'উপাধ্যক্ষ', 'সহকারী অধ্যাপক', 'প্রভাষক', 'সহকারী শিক্ষক', 'ইবতেদায়ী', 'অন্যান্য'];
// বাংলা টেক্সট এক রূপে আনা: ইউনিকোডের ভিন্ন রূপ (ী/ি, ূ/ু, ড়, ZWNJ) ও স্পেস/ড্যাশ বাদ
const fold = x => String(x || '').normalize('NFC').replace(/[\s\-.\u200c\u200d]/g, '').replace(/ী/g, 'ি').replace(/ূ/g, 'ু').toLowerCase();
const R = src => new RegExp(src.normalize('NFC').replace(/ী/g, 'ি').replace(/ূ/g, 'ু'), 'i');
const EBT = R('[ইএ]বতেদায়[ীি]|ebtedayee|ibtidai');
const QARI = R('ক্বারি|ক্বরি|qari');
const QARI_LOOSE = R('(^|[^হ])কারি');   // 'কারী' (ক্ব ছাড়া), তবে 'সহকারী' নয়
const RX_STAFF = R('কর্মচারী|পিয়ন|পিওন|দপ্তরি|দফতরি|নৈশ|প্রহরী|আয়া|ঝাড়ু|অফিসসহকারী|ক্লার্ক|কেরানি|staff|peon');
const RX_PRINC = R('ধ্?য?ক্?ষ|প্রিন্সিপাল|principal');
const RX_DEPUTY = R('উপ|deputy|vice|ভাইস');
const RX_ASSTPROF = R('সহকারী(অধ্যাপক|প্রফেসর)|সহঃ?অধ্যাপক|assistantprofessor');
const RX_LECT = R('প্রভা[ষস]ক|lecturer');
const RX_LIB = R('গ্রন্থাগ[ার]*িক|লাইব্রেরিয়ান|librarian');
const RX_PROF = R('অধ্যাপক|প্রফেসর|professor');
const RX_TEACH = R('সহকারী|সহকারি|সহঃ|শিক্ষক|শিক্ষিকা|মৌলভী|মৌলবী|মাওলানা|assistant|teacher');
// একটি টেক্সট থেকে ক্যাটাগরি (না পেলে অন্যান্য)
function catFromText(raw, loose){
  const d = fold(raw), K = n => CATS.indexOf(n);
  if (!d) return K('অন্যান্য');
  if (RX_STAFF.test(d)) return K('অন্যান্য');   // কর্মচারীরা অন্যান্য সেকশনে
  if (EBT.test(d) || QARI.test(d) || (loose && QARI_LOOSE.test(d))) return K('ইবতেদায়ী');   // ক্বারীও ইবতেদায়ীতে
  const princ = RX_PRINC.test(d);
  if (princ && RX_DEPUTY.test(d)) return K('উপাধ্যক্ষ');
  if (princ) return K('অধ্যক্ষ');
  if (RX_ASSTPROF.test(d)) return K('সহকারী অধ্যাপক');
  if (RX_LECT.test(d)) return K('প্রভাষক');
  if (RX_LIB.test(d)) return K('সহকারী শিক্ষক');
  if (RX_PROF.test(d)) return K('অন্যান্য');
  if (RX_TEACH.test(d)) return K('সহকারী শিক্ষক');
  return K('অন্যান্য');
}
const SKIP_KEYS = ['id', 'name', 'phone', 'email', 'mobile', 'password', 'uid'];
function catOf(t){
  const K = n => CATS.indexOf(n);
  const dz = desigOf(t);
  if (RX_STAFF.test(fold(dz))) return K('অন্যান্য');   // কর্মচারী: অন্য ঘর দেখার দরকার নেই
  let c = catFromText(dz, true);
  // পদবির ঘরে না পেলে শিক্ষকের অন্য ঘরগুলোতে খোঁজা (ঘরের নাম যা-ই হোক)
  if (c === K('অন্যান্য')) {
    for (const k in t) {
      if (SKIP_KEYS.includes(k) || typeof t[k] !== 'string') continue;
      const x = catFromText(t[k], false);
      if (x !== K('অন্যান্য')) { c = x; break; }
    }
  }
  // পদবি শিক্ষক/অন্যান্য হলে, কোনো ঘরে "ইবতেদায়ী" থাকলে ইবতেদায়ীতে
  if (c === K('সহকারী শিক্ষক') || c === K('অন্যান্য')) {
    for (const k in t) { if (k !== 'id' && typeof t[k] === 'string' && (EBT.test(fold(t[k])) || QARI.test(fold(t[k])))) return K('ইবতেদায়ী'); }
  }
  return c;
}
function groupByCat(arr){
  const g = CATS.map(() => []);
  arr.forEach(t => g[catOf(t)].push(t));
  return g;
}
function printTable(){
  if (!auth.currentUser) { $('ptbl').innerHTML = ''; return; }
  const row = t => {
    const x = missed[t.id] || {total:0, ptotal:0}, ph = normPhone(t.phone), ix = idxOf(t);
    return `<tr><td class="l">${esc(t.name)}</td><td>${ix !== '' ? bn(esc(ix)) : '–'}</td><td>${ph ? bn(ph) : '–'}</td><td>${bn(x.total)}</td><td>${bn(x.ptotal)}</td></tr>`;
  };
  const rows = groupByCat(teachers).map((arr, i) => arr.length
    ? `<tr class="sh"><td colspan="5">${CATS[i]} (${bn(arr.length)} জন)</td></tr>` + arr.map(row).join('') : '').join('');
  $('ptbl').innerHTML = `<h3 style="text-align:center;margin:0 0 2px">শিক্ষকবৃন্দের তথ্য</h3>
    <div style="text-align:center;margin-bottom:8px;font-size:13px">${bn(Y)} সাল (জানুয়ারি – ডিসেম্বর)</div>
    <table><thead><tr><th>নাম</th><th>ইনডেক্স নং</th><th>মোবাইল নং</th><th>মোট ক্লাস মিস</th><th>মোট প্রক্সি</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function render(){
  const q = $('q').value.trim().toLowerCase();
  const list = teachers.filter(t => !q || (t.name||'').toLowerCase().includes(q) || (t.subject||'').toLowerCase().includes(q) || normPhone(t.phone).includes(q.replace(/\D/g,'') || '§'));
  printTable();
  $('cnt').textContent = 'মোট ' + bn(list.length) + ' জন শিক্ষক';
  const card = t => {
    const ph = normPhone(t.phone), ok = /^01\d{9}$/.test(ph), ix = idxOf(t), ds = desigOf(t);
    return `<div class="t">
      ${typeof t.photo === 'string' && t.photo.startsWith('data:image/') ? `<img class="av" src="${t.photo}" alt="" style="object-fit:cover;background:none">` : `<div class="av">${esc((t.name||'?').trim().charAt(0))}</div>`}
      <div class="in">
        <b>${esc(t.name)}</b>
        <div class="mu r1">${esc(ds || '—')} • ইন্ডেক্স: ${ix !== '' ? bn(esc(ix)) : '–'}</div>
        <div class="mu r2">${ok ? bn(ph) : 'নম্বর নেই'}</div>
      </div>
      <div class="acts">
        <a class="call ${ok?'':'off'}" href="${ok ? 'tel:+88' + ph : '#'}" title="কল">📞</a>
        <a class="wa ${ok?'':'off'}" href="${ok ? 'https://wa.me/88' + ph : '#'}" target="_blank" rel="noopener" title="WhatsApp">💬</a>
      </div>
      <div class="bot">
        ${absTag(t.id)}
      </div></div>`;
  };
  $('list').innerHTML = list.length ? groupByCat(list).map((arr, i) => arr.length
    ? `<div class="sec">${CATS[i]} <span>${bn(arr.length)} জন</span></div>` + arr.map(card).join('') : '').join('')
    : '<div class="empty">কোনো শিক্ষক পাওয়া যায়নি</div>';
}

// প্রক্সি যিনি করেছেন তার আইডির সম্ভাব্য ফিল্ড (আপনার ডাটায় যেটা আছে সেটা ধরবে)
const PROXY_FIELDS = ['proxyId','proxyTeacherId','subId','substituteId','proxyTeacher','teacherId','byId','newId','toId'];
function proxyOf(p){ for (const f of PROXY_FIELDS) if (p[f] && p[f] !== p.absentId) return p[f]; return null; }
function loadMissed(){
  $('yl').textContent = bn(Y) + ' সাল (জানুয়ারি – ডিসেম্বর)';
  const yy = Y;
  db.collection('proxies').where('date', '>=', yy + '-01-01').where('date', '<=', yy + '-12-31').get().then(q => {
    if (yy !== Y) return;
    missed = {};
    const get = id => missed[id] = missed[id] || {m: Array(12).fill(0), total: 0, pm: Array(12).fill(0), ptotal: 0, ml: [], pl: []};
    q.docs.forEach(d => { const p = d.data();
      const mi = parseInt(String(p.date).slice(5, 7), 10) - 1;
      if (mi < 0 || mi > 11) return;
      const pid = proxyOf(p), det = {d: String(p.date), c: clsOf(p), s: subOf(p), pr: perOf(p)};
      if (p.absentId) { const a = get(p.absentId); a.m[mi]++; a.total++; a.ml.push({...det, o: pid}); }
      if (pid) { const b = get(pid); b.pm[mi]++; b.ptotal++; b.pl.push({...det, o: p.absentId}); } });
    render(); if (rcId) drawRC();
  }).catch(e => console.error(e));
}
// ক্লাস / বিষয় / পিরিয়ডের সম্ভাব্য ফিল্ড (আপনার ডাটায় যেটা আছে সেটা ধরবে)
const pick = (p, fs) => { for (const f of fs) { const v = p[f]; if (v !== undefined && v !== null && v !== '' && typeof v !== 'object') return String(v); } return ''; };
const clsOf = p => pick(p, ['className','class','cls','classId','classNo','classNumber','grade','section']);
const subOf = p => pick(p, ['subject','subjectName','sub','subjectId']);
const perOf = p => pick(p, ['period','periodNo','periodNumber','slot']);

var rcId = null, rcMode = 'all';   // m = শুধু ক্লাস মিস, p = শুধু প্রক্সি, all = দুটোই
const tName = id => { const x = teachers.find(z => z.id === id); return x ? x.name : (id ? String(id) : '–'); };
function openRC(id, mode){
  if (!auth.currentUser) return;
  rcId = id; rcMode = mode || 'all';
  drawRC(); $('rcm').classList.add('show'); document.body.style.overflow = 'hidden';
}
function closeRC(){ rcId = null; $('rcm').classList.remove('show'); document.body.classList.remove('rcp'); document.body.style.overflow = ''; }
const rcLabel = () => rcMode === 'm' ? 'ক্লাস মিসের তালিকা' : rcMode === 'p' ? 'প্রক্সির তালিকা' : 'রিপোর্ট কার্ড';
function printRC(){ document.body.classList.add('rcp'); doPrint(); }
window.addEventListener('afterprint', () => document.body.classList.remove('rcp', 'rtp'));
function downloadRC(){
  const t = teachers.find(x => x.id === rcId); if (!t) return;
  const c = $('rcc').cloneNode(true);
  c.querySelectorAll('.rcno').forEach(e => e.remove());
  const po = c.querySelector('.rcp-only'); if (po) po.style.cssText = 'text-align:center;font-weight:700;margin:8px 0';
  const css = '@page{size:A4 portrait;margin:10mm}*{box-sizing:border-box}html{background:#ddd}'
    + 'body{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;width:210mm;min-height:297mm;margin:0 auto;padding:12mm 10mm;background:#fff;color:#000;line-height:1.45;font-size:13px}'
    + '.rch h3{margin:0 0 4px;font-size:18px}.mu{font-size:12px;color:#444}.rcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.rcs div{border:1px solid #000;text-align:center;padding:6px;border-radius:8px;font-size:12px}.rcs b{display:block;font-size:20px}'
    + '.sec{display:flex;justify-content:space-between;border-bottom:2px solid #000;margin:14px 0 8px;font-weight:700;font-size:14px}.sec span{font-weight:400;font-size:12px}'
    + '.rt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}.rt th,.rt td{border:1px solid #000;padding:5px 3px;text-align:center;word-break:break-word;overflow-wrap:anywhere}.rt th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + '.rt th:nth-child(1){width:20%}.rt th:nth-child(2){width:12%}.rt th:nth-child(3){width:20%}.rt thead{display:table-header-group}.rt tr{page-break-inside:avoid}.empty{text-align:center;padding:10px;font-size:12px}'
    + '@media print{html{background:#fff}body{width:auto;min-height:0;margin:0;padding:0}}'
    + '@media print{html{-webkit-filter:grayscale(1);filter:grayscale(1)}*{color:#000!important}.rt small,.mu{color:#333!important}}';
  const html = '<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=794"><title>' + rcLabel() + ' - ' + esc(t.name) + '</title><style>' + css + '</style></head><body>' + c.innerHTML + '</body></html>';
  const nm = String(t.name || 'শিক্ষক').replace(/[\\\/:*?"<>|]/g, '').trim();
  const fname = rcLabel().replace(/ /g, '-') + '-' + nm + '-' + Y + '.html';
  // অ্যান্ড্রয়েড অ্যাপ: সরাসরি Downloads ফোল্ডারে সেভ
  if (window.AndroidPrint && typeof AndroidPrint.saveFile !== 'undefined') { AndroidPrint.saveFile(fname, html, 'text/html'); return; }
  // অ্যাপের ভেতরে আছে কিন্তু অ্যাপে ডাউনলোড সুবিধা নেই (পুরনো অ্যাপ ভার্সন)
  if (window.AndroidPrint) { alert('ডাউনলোডের জন্য অ্যাপটি নতুন ভার্সনে আপডেট করুন (MainActivity.java নতুন করে বিল্ড করুন)।'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
  a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function drawRC(){
  const t = teachers.find(x => x.id === rcId); if (!t) return;
  const a = missed[rcId] || {ml: [], pl: []};
  const srt = (x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0;
  const ml = a.ml.slice().sort(srt), pl = a.pl.slice().sort(srt);
  const dt = e => bn(e.d.slice(8, 10) + '/' + e.d.slice(5, 7) + '/' + e.d.slice(0, 4));
  const oName = id => !id ? '–' : id === '__none__' ? 'শিক্ষক নেই' : esc(tName(id));
  const tbl = (rows, oLabel) => rows.length
    ? '<table class="rt"><thead><tr><th>তারিখ</th><th>পিরিয়ড</th><th>শ্রেণী</th><th>বিষয়</th><th>' + oLabel + '</th></tr></thead><tbody>' +
      rows.map(e => `<tr><td>${dt(e)}</td><td>${e.pr ? bn(esc(e.pr)) : '–'}</td><td>${e.c ? bn(esc(e.c)) : '–'}</td><td>${e.s ? esc(e.s) : '–'}</td><td>${oName(e.o)}</td></tr>`).join('') + '</tbody></table>'
    : '<div class="empty">এই বছরে কোনো তথ্য নেই</div>';
  const ix = idxOf(t), ds = desigOf(t), showM = rcMode !== 'p', showP = rcMode !== 'm';
  $('rcc').innerHTML = `<div class="rch"><div><h3>${rcMode === 'm' ? '❌' : rcMode === 'p' ? '✅' : '📋'} ${esc(t.name)}</h3><div class="mu">${esc(ds || '—')} • ইন্ডেক্স: ${ix !== '' ? bn(esc(ix)) : '–'}</div></div><button class="rcx rcno" onclick="closeRC()">✕</button></div>
    <div class="yr rcno"><button onclick="shiftY(-1)">◀</button><b>${bn(Y)} সাল (জানুয়ারি – ডিসেম্বর)</b><button onclick="shiftY(1)">▶</button></div>
    <div style="text-align:center;font-weight:700;margin:8px 0;display:none" class="rcp-only">${bn(Y)} সাল</div>
    <div class="rcs"${rcMode === 'all' ? '' : ' style="grid-template-columns:1fr"'}>${showM ? `<div class="a"><b>${bn(ml.length)}</b>ক্লাস মিস</div>` : ''}${showP ? `<div class="b"><b>${bn(pl.length)}</b>প্রক্সি নিয়েছেন</div>` : ''}</div>
    ${showM ? `<div class="sec">❌ ক্লাস মিসের তালিকা <span>${bn(Y)} সাল</span></div>${tbl(ml, 'ক্লাস নিয়েছেন')}` : ''}
    ${showP ? `<div class="sec">✅ প্রক্সির তালিকা <span>${bn(Y)} সাল</span></div>${tbl(pl, 'যার ক্লাস নিয়েছেন')}` : ''}
    <div class="rcno" style="display:flex;gap:8px"><button class="pbtn" onclick="downloadRC()">⬇️ ডাউনলোড</button><button class="pbtn" onclick="printRC()">🖨️ প্রিন্ট</button></div>`;
}

// ===== শিক্ষকের সাপ্তাহিক রুটিন (routines কালেকশন) =====
var rtId = null, rtRows = [], rtLoading = false;
const RT_DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const RT_ORDER = [6,0,1,2,3,4,5];   // শনি থেকে শুরু
const rtFmt = t => { if (!t) return ''; const p = String(t).split(':').map(Number); if (isNaN(p[0])) return ''; let h = p[0], m = p[1] || 0; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return bn(h + ':' + String(m).padStart(2, '0')) + ' ' + ap; };
function openRT(id){
  rtId = id; rtRows = []; rtLoading = true;
  drawRT(); $('rtm').classList.add('show'); document.body.style.overflow = 'hidden';
  db.collection('routines').where('teacherId', '==', id).get().then(q => {
    if (rtId !== id) return;
    rtRows = q.docs.map(d => ({id: d.id, ...d.data()})); rtLoading = false; drawRT();
  }).catch(e => { if (rtId !== id) return; rtLoading = false; $('rtc').querySelector('.rtbody').innerHTML = '<div class="empty">লোড করা যায়নি<br><span class="mu">' + esc(e.code || '') + ' ' + esc(e.message) + '</span></div>'; });
}
function closeRT(){ rtId = null; $('rtm').classList.remove('show'); document.body.classList.remove('rtp'); document.body.style.overflow = ''; }
function printRT(){ document.body.classList.add('rtp'); doPrint(); }
function rtTable(){
  const rows = rtRows.filter(r => r.period != null);
  if (!rows.length) return '<div class="empty">এই শিক্ষকের কোনো রুটিন নেই</div>';
  const periods = [...new Set(rows.map(r => +r.period))].sort((a, b) => a - b);
  const time = {};   // পিরিয়ডের সময়: প্রথম যে এন্ট্রিতে আছে
  rows.forEach(r => { if (!time[r.period] && r.start) time[r.period] = rtFmt(r.start) + (r.end ? ' – ' + rtFmt(r.end) : ''); });
  const today = new Date().getDay();
  const days = RT_ORDER.filter(d => rows.some(r => r.day === d));
  const head = '<tr><th>বার</th>' + periods.map(p => `<th>${bn(p)}ম পিরিয়ড${time[p] ? '<small>' + time[p] + '</small>' : ''}</th>`).join('') + '</tr>';
  const body = days.map(d => '<tr' + (d === today ? ' class="today"' : '') + `><td class="dn">${RT_DAYS[d]}</td>` + periods.map(p => {
    const it = rows.filter(r => r.day === d && +r.period === p);
    return '<td>' + (it.length ? it.map(r => `${esc(r.class)}<small>${esc(r.subject)}${r.room ? ' • রুম ' + esc(r.room) : ''}</small>`).join('<hr style="border:0;border-top:1px dashed var(--bd);margin:3px 0">') : '–') + '</td>';
  }).join('') + '</tr>').join('');
  return `<div class="rtw"><table class="rt g"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function drawRT(){
  const t = teachers.find(x => x.id === rtId); if (!t) return;
  const ix = idxOf(t), ds = desigOf(t), n = rtRows.length;
  const days = new Set(rtRows.map(r => r.day)).size;
  $('rtc').innerHTML = `<div class="rch"><div><h3>📅 ${esc(t.name)} — সাপ্তাহিক রুটিন</h3><div class="mu">${esc(ds || '—')} • ইন্ডেক্স: ${ix !== '' ? bn(esc(ix)) : '–'}</div></div><button class="rcx rcno" onclick="closeRT()">✕</button></div>
    <div class="rcs"><div class="b"><b>${rtLoading ? '…' : bn(n)}</b>সাপ্তাহিক ক্লাস</div><div class="b"><b>${rtLoading ? '…' : bn(days)}</b>ক্লাসের দিন</div></div>
    <div class="rtbody">${rtLoading ? '<div class="empty">লোড হচ্ছে...</div>' : rtTable()}</div>
    <div class="rcno" style="display:flex;gap:8px"><button class="pbtn" onclick="downloadRT()">⬇️ ডাউনলোড</button><button class="pbtn" onclick="printRT()">🖨️ প্রিন্ট</button></div>`;
}
function downloadRT(){
  const t = teachers.find(x => x.id === rtId); if (!t) return;
  const c = $('rtc').cloneNode(true);
  c.querySelectorAll('.rcno').forEach(e => e.remove());
  const css = '@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}html{background:#ddd}'
    + 'body{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;width:297mm;min-height:210mm;margin:0 auto;padding:10mm;background:#fff;color:#000;line-height:1.45;font-size:13px}'
    + '.rch h3{margin:0 0 4px;font-size:18px}.mu{font-size:12px;color:#444}.rcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.rcs div{border:1px solid #000;text-align:center;padding:6px;border-radius:8px;font-size:12px}.rcs b{display:block;font-size:20px}'
    + '.rt{width:100%;border-collapse:collapse;font-size:12px}.rt th,.rt td{border:1px solid #000;padding:5px 4px;text-align:center}.rt th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rt small{display:block;font-size:11px;font-weight:400;color:#333}.rt td.dn{font-weight:700;white-space:nowrap}.empty{text-align:center;padding:10px}'
    + '@media print{html{background:#fff}body{width:auto;min-height:0;margin:0;padding:0}}'
    + '@media print{html{-webkit-filter:grayscale(1);filter:grayscale(1)}*{color:#000!important}.rt small,.mu{color:#333!important}}';
  const html = '<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=1123"><title>রুটিন - ' + esc(t.name) + '</title><style>' + css + '</style></head><body>' + c.innerHTML + '</body></html>';
  const nm = String(t.name || 'শিক্ষক').replace(/[\\\/:*?"<>|]/g, '').trim();
  const fname = 'রুটিন-' + nm + '.html';
  if (window.AndroidPrint && typeof AndroidPrint.saveFile !== 'undefined') { AndroidPrint.saveFile(fname, html, 'text/html'); return; }
  if (window.AndroidPrint) { alert('ডাউনলোডের জন্য অ্যাপটি নতুন ভার্সনে আপডেট করুন (MainActivity.java নতুন করে বিল্ড করুন)।'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
  a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
var unsubT = null;
// শিক্ষক তালিকা: আগে ক্যাশ (localStorage) থেকে দ্রুত দেখানো, তারপর সার্ভার থেকে আপডেট
const TC_KEY = 'teachersCache_v1';
function readTC(){ try { const c = JSON.parse(localStorage.getItem(TC_KEY) || 'null'); return Array.isArray(c) ? c : null; } catch (e) { return null; } }
function saveTC(arr){ try { localStorage.setItem(TC_KEY, JSON.stringify(arr)); } catch (e) {} }
function startT(){
  if (auth.currentUser) loadMissed();
  const c = readTC();
  if (c && c.length) { teachers = c; render(); }
  unsubT = db.collection('teachers').orderBy('name').onSnapshot(s => {
    teachers = s.docs.map(d => ({id:d.id, ...d.data()}));
    if (!s.metadata.fromCache) saveTC(teachers);   // সার্ভার থেকে আসা ডাটাই ক্যাশে রাখা
    render(); if (rtId) drawRT();
  }, e => { if (!teachers.length) $('list').innerHTML = '<div class="empty">লোড করা যায়নি<br><span class="mu">' + esc(e.code || '') + ' ' + esc(e.message) + '</span></div>'; });
}
// পেজ খুলেই ক্যাশ থেকে দেখানো (লগইন যাচাইয়ের অপেক্ষা না করে)
{ const c = readTC(); if (c && c.length) { teachers = c; render(); } }
auth.onAuthStateChanged(u => {
  if (unsubT) { unsubT(); unsubT = null; }
  teachers = []; missed = {};
  closeRC();
  document.body.classList.toggle('guest', !u);
  startT();
});
</script>
