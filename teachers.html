<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষকবৃন্দ</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#17241c;--mu:#62736a;--pr:#0f7a4a;--pr2:#0b5c37;--gd:#c9a227;--bd:#dbe7df}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16231b;--tx:#e6f0ea;--mu:#94a89c;--pr:#34b57a;--pr2:#0b5c37;--bd:#254033}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}
.bar{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.bar a{background:rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.cnt{margin:8px 2px;color:var(--mu);font-size:13px}
.t{flex-wrap:wrap;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.av{width:46px;height:46px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.in{flex:1;min-width:0}
.in b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
.acts{display:flex;gap:6px;flex:none}
.acts a{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.call{background:var(--pr)}.wa{background:#25d366}.off{background:var(--mu);opacity:.5;pointer-events:none}
.ab{display:inline-block;margin-top:2px;padding:0 8px;border-radius:999px;font-size:12px;background:rgba(220,38,38,.12);color:#dc2626;border:1px solid rgba(220,38,38,.35)}
.ab.p{background:rgba(15,122,74,.12);color:var(--pr);border-color:rgba(15,122,74,.35)}
.tgs{display:flex;flex-wrap:wrap;gap:4px}
.ab.z{background:rgba(15,122,74,.12);color:var(--pr);border-color:rgba(15,122,74,.35)}
.yr{display:flex;align-items:center;gap:8px;margin:10px 0}
.yr b{flex:1;text-align:center}
.yr button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.ab{cursor:pointer}
.mg{flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px dashed var(--bd);padding-top:10px}
.mg div{text-align:center;border:1px solid var(--bd);border-radius:10px;padding:4px 2px;font-size:12px;color:var(--mu)}
.mg div b{display:block;font-size:17px;color:var(--mu)}
.mg div.on{border-color:var(--bd);background:rgba(220,38,38,.06)}
.mg div span{display:block;font-size:13px}
.mg div span i{font-style:normal}
.mg .cm{color:#dc2626;font-weight:700}.mg .cp{color:var(--pr);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;padding:0 0 4px;border-bottom:2px solid var(--pr);color:var(--pr);font-weight:700;font-size:16px}
.sec span{font-size:13px;color:var(--mu);font-weight:500}
#ptbl{display:none}
@page{size:A4 portrait;margin:12mm 10mm}
.pbtn{font:inherit;padding:10px;border-radius:10px;border:0;background:var(--pr);color:#fff;width:100%;margin-top:8px;cursor:pointer;font-weight:700}

/* নতুন লেআউট: পদবি+ইন্ডেক্স এক সারি, ফোন এক সারি, নিচে মিস/প্রক্সি/কল এক সারি */
.in .r1,.in .r2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--bd);padding-top:10px}
.bot .tgs{flex-wrap:nowrap;flex:1;min-width:0}
.bot .ab{white-space:nowrap;margin-top:0}

@media print{
html,body{width:190mm;margin:0;padding:0}
.bar,.yr,#q,.pbtn,.cnt,#list{display:none!important}
.wrap{max-width:none;margin:0;padding:0}
body{background:#fff;color:#000;font-size:12px;line-height:1.35}
#ptbl{display:block!important;width:100%}
#ptbl table{width:100%;table-layout:fixed;border-collapse:collapse}
#ptbl th,#ptbl td{border:1px solid #000;padding:4px 3px;text-align:center;word-break:break-word;overflow-wrap:anywhere}
#ptbl th:nth-child(1),#ptbl td:nth-child(1){width:30%}
#ptbl th:nth-child(2),#ptbl td:nth-child(2){width:16%}
#ptbl th:nth-child(3),#ptbl td:nth-child(3){width:22%}
#ptbl th:nth-child(4),#ptbl td:nth-child(4){width:16%}
#ptbl th:nth-child(5),#ptbl td:nth-child(5){width:16%}
#ptbl td.l{text-align:left}
#ptbl thead{display:table-header-group}
#ptbl th{background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11px}
#ptbl tr{page-break-inside:avoid}
#ptbl tr.sh td{background:#cfe3d6;font-weight:700;text-align:left;font-size:12.5px;padding:5px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid;page-break-after:avoid}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="bar"><b>👨‍🏫 শিক্ষকবৃন্দ</b><a href="index.html">হোম</a></div>

<div class="wrap">
  <div id="need" class="hide" style="background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:30px 0;text-align:center">
    <b>🔐 এই পেজ দেখতে লগইন করুন</b>
    <div style="color:var(--mu);font-size:13px;margin:4px 0 12px">শিক্ষক বা অ্যাডমিন হিসেবে লগইন করলে তথ্য দেখা যাবে</div>
    <a href="teacher.html" style="display:inline-block;background:var(--pr);color:#fff;padding:8px 20px;border-radius:999px;font-weight:700">👨‍🏫 শিক্ষক লগইন</a>
    <a href="admin.html" style="display:inline-block;background:var(--mu);color:#fff;padding:8px 20px;border-radius:999px;font-weight:700">🔐 অ্যাডমিন</a>
  </div>
  <div id="main" class="hide">
  <div class="yr"><button onclick="shiftY(-1)">◀</button><b id="yl"></b><button onclick="shiftY(1)">▶</button></div>
  <input id="q" type="search" placeholder="🔍 নাম, বিষয় বা মোবাইল দিয়ে খুঁজুন" oninput="render()">
  <button class="pbtn" onclick="doPrint()">🖨️ সব শিক্ষকের তথ্য প্রিন্ট করুন</button>
  <div class="cnt" id="cnt"></div>
  <div id="ptbl"></div>
  <div id="list"><div class="empty">লোড হচ্ছে...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
function doPrint(){ if (window.AndroidPrint && typeof AndroidPrint.print === 'function') AndroidPrint.print(); else window.print(); }
firebase.initializeApp({
  apiKey: "AIzaSyCDjI1t2EnJKmvAV3hbz-sjir8YW8IfOQg",
  authDomain: "mmmmg-d02b8.firebaseapp.com",
  projectId: "mmmmg-d02b8",
  storageBucket: "mmmmg-d02b8.firebasestorage.app",
  messagingSenderId: "1001193607775",
  appId: "1:1001193607775:web:c4539574a49cddf59341ea"
});
const db = firebase.firestore(), auth = firebase.auth();
const $ = id => document.getElementById(id);
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normPhone = p => { let d = String(p||'').replace(/\D/g,''); if (d.startsWith('880')) d = d.slice(3); if (d.length === 10 && d[0] === '1') d = '0' + d; return d; };
var teachers = [], missed = {}, openId = {}, Y = new Date().getFullYear();
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

// মোট ক্লাস মিস (অনুপস্থিত থাকায়) ও মোট প্রক্সি (অন্যের ক্লাস নেওয়ায়)
function absTag(id){
  const a = missed[id], cls = a ? a.total : 0, px = a ? a.ptotal : 0;
  const arrow = openId[id] ? '▴' : '▾';
  return `<div class="tgs"><span class="ab ${cls ? '' : 'z'}" onclick="tg('${id}')">মিস: ${bn(cls)}টি ${arrow}</span><span class="ab p" onclick="tg('${id}')">প্রক্সি: ${bn(px)}টি ${arrow}</span></div>`;
}
function months(id){
  const a = missed[id];
  return '<div class="mg">' + MONTHS.map((m, i) => { const n = a ? a.m[i] : 0, p = a ? a.pm[i] : 0; return `<div class="${n || p ? 'on' : ''}">${m}<span><i class="cm">মিস ${bn(n)}</i> • <i class="cp">প্রক্সি ${bn(p)}</i></span></div>`; }).join('') + '</div>';
}
function tg(id){ openId[id] = !openId[id]; render(); }
function shiftY(n){ Y += n; loadMissed(); }
// ইনডেক্স নম্বরের সম্ভাব্য ফিল্ড
const INDEX_FIELDS = ['index','indexNo','indexNumber','idx','indexNum','teacherIndex'];
const idxOf = t => { for (const f of INDEX_FIELDS) if (t[f] !== undefined && t[f] !== '') return t[f]; return ''; };
// পদবির সম্ভাব্য ফিল্ড (না পেলে বিষয় দেখাবে)
const DESIG_FIELDS = ['designation','post','position','title','role','পদবি'];
const desigOf = t => { for (const f of DESIG_FIELDS) if (t[f]) return t[f]; return t.subject || ''; };

// ক্যাটাগরি: পদবি দেখে ভাগ করা হয় (বানানের ছোটখাটো ভিন্নতা ধরবে)
const CATS = ['অধ্যক্ষ', 'উপাধ্যক্ষ', 'সহকারী অধ্যাপক', 'প্রভাষক', 'সহকারী শিক্ষক', 'ইবতেদায়ী', 'অন্যান্য'];
// বাংলা টেক্সট এক রূপে আনা: ইউনিকোডের ভিন্ন রূপ (ী/ি, ূ/ু, ড়, ZWNJ) ও স্পেস/ড্যাশ বাদ
const fold = x => String(x || '').normalize('NFC').replace(/[\s\-.\u200c\u200d]/g, '').replace(/ী/g, 'ি').replace(/ূ/g, 'ু').toLowerCase();
const R = src => new RegExp(src.normalize('NFC').replace(/ী/g, 'ি').replace(/ূ/g, 'ু'), 'i');
const EBT = R('[ইএ]বতেদায়[ীি]|ebtedayee|ibtidai');
const QARI = R('ক্বারি|ক্বরি|qari');
const QARI_LOOSE = R('(^|[^হ])কারি');   // 'কারী' (ক্ব ছাড়া), তবে 'সহকারী' নয়
const RX_STAFF = R('কর্মচারী|পিয়ন|পিওন|দপ্তরি|দফতরি|নৈশ|প্রহরী|আয়া|ঝাড়ু|অফিসসহকারী|ক্লার্ক|কেরানি|staff|peon');
const RX_PRINC = R('ধ্?য?ক্?ষ|প্রিন্সিপাল|principal');
const RX_DEPUTY = R('উপ|deputy|vice|ভাইস');
const RX_ASSTPROF = R('সহকারী(অধ্যাপক|প্রফেসর)|সহঃ?অধ্যাপক|assistantprofessor');
const RX_LECT = R('প্রভা[ষস]ক|lecturer');
const RX_LIB = R('গ্রন্থাগ[ার]*িক|লাইব্রেরিয়ান|librarian');
const RX_PROF = R('অধ্যাপক|প্রফেসর|professor');
const RX_TEACH = R('সহকারী|সহকারি|সহঃ|শিক্ষক|শিক্ষিকা|মৌলভী|মৌলবী|মাওলানা|assistant|teacher');
// একটি টেক্সট থেকে ক্যাটাগরি (না পেলে অন্যান্য)
function catFromText(raw, loose){
  const d = fold(raw), K = n => CATS.indexOf(n);
  if (!d) return K('অন্যান্য');
  if (RX_STAFF.test(d)) return K('অন্যান্য');   // কর্মচারীরা অন্যান্য সেকশনে
  if (EBT.test(d) || QARI.test(d) || (loose && QARI_LOOSE.test(d))) return K('ইবতেদায়ী');   // ক্বারীও ইবতেদায়ীতে
  const princ = RX_PRINC.test(d);
  if (princ && RX_DEPUTY.test(d)) return K('উপাধ্যক্ষ');
  if (princ) return K('অধ্যক্ষ');
  if (RX_ASSTPROF.test(d)) return K('সহকারী অধ্যাপক');
  if (RX_LECT.test(d)) return K('প্রভাষক');
  if (RX_LIB.test(d)) return K('সহকারী শিক্ষক');
  if (RX_PROF.test(d)) return K('অন্যান্য');
  if (RX_TEACH.test(d)) return K('সহকারী শিক্ষক');
  return K('অন্যান্য');
}
const SKIP_KEYS = ['id', 'name', 'phone', 'email', 'mobile', 'password', 'uid'];
function catOf(t){
  const K = n => CATS.indexOf(n);
  const dz = desigOf(t);
  if (RX_STAFF.test(fold(dz))) return K('অন্যান্য');   // কর্মচারী: অন্য ঘর দেখার দরকার নেই
  let c = catFromText(dz, true);
  // পদবির ঘরে না পেলে শিক্ষকের অন্য ঘরগুলোতে খোঁজা (ঘরের নাম যা-ই হোক)
  if (c === K('অন্যান্য')) {
    for (const k in t) {
      if (SKIP_KEYS.includes(k) || typeof t[k] !== 'string') continue;
      const x = catFromText(t[k], false);
      if (x !== K('অন্যান্য')) { c = x; break; }
    }
  }
  // পদবি শিক্ষক/অন্যান্য হলে, কোনো ঘরে "ইবতেদায়ী" থাকলে ইবতেদায়ীতে
  if (c === K('সহকারী শিক্ষক') || c === K('অন্যান্য')) {
    for (const k in t) { if (k !== 'id' && typeof t[k] === 'string' && (EBT.test(fold(t[k])) || QARI.test(fold(t[k])))) return K('ইবতেদায়ী'); }
  }
  return c;
}
function groupByCat(arr){
  const g = CATS.map(() => []);
  arr.forEach(t => g[catOf(t)].push(t));
  return g;
}
function printTable(){
  const row = t => {
    const x = missed[t.id] || {total:0, ptotal:0}, ph = normPhone(t.phone), ix = idxOf(t);
    return `<tr><td class="l">${esc(t.name)}</td><td>${ix !== '' ? bn(esc(ix)) : '–'}</td><td>${ph ? bn(ph) : '–'}</td><td>${bn(x.total)}</td><td>${bn(x.ptotal)}</td></tr>`;
  };
  const rows = groupByCat(teachers).map((arr, i) => arr.length
    ? `<tr class="sh"><td colspan="5">${CATS[i]} (${bn(arr.length)} জন)</td></tr>` + arr.map(row).join('') : '').join('');
  $('ptbl').innerHTML = `<h3 style="text-align:center;margin:0 0 2px">শিক্ষকবৃন্দের তথ্য</h3>
    <div style="text-align:center;margin-bottom:8px;font-size:13px">${bn(Y)} সাল (জানুয়ারি – ডিসেম্বর)</div>
    <table><thead><tr><th>নাম</th><th>ইনডেক্স নং</th><th>মোবাইল নং</th><th>মোট ক্লাস মিস</th><th>মোট প্রক্সি</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function render(){
  const q = $('q').value.trim().toLowerCase();
  const list = teachers.filter(t => !q || (t.name||'').toLowerCase().includes(q) || (t.subject||'').toLowerCase().includes(q) || normPhone(t.phone).includes(q.replace(/\D/g,'') || '§'));
  printTable();
  $('cnt').textContent = 'মোট ' + bn(list.length) + ' জন শিক্ষক';
  const card = t => {
    const ph = normPhone(t.phone), ok = /^01\d{9}$/.test(ph), ix = idxOf(t), ds = desigOf(t);
    return `<div class="t">
      <div class="av">${esc((t.name||'?').trim().charAt(0))}</div>
      <div class="in">
        <b>${esc(t.name)}</b>
        <div class="mu r1">${esc(ds || '—')} • ইন্ডেক্স: ${ix !== '' ? bn(esc(ix)) : '–'}</div>
        <div class="mu r2">${ok ? bn(ph) : 'নম্বর নেই'}</div>
      </div>
      <div class="bot">
        ${absTag(t.id)}
        <div class="acts">
          <a class="call ${ok?'':'off'}" href="${ok ? 'tel:+88' + ph : '#'}" title="কল">📞</a>
          <a class="wa ${ok?'':'off'}" href="${ok ? 'https://wa.me/88' + ph : '#'}" target="_blank" rel="noopener" title="WhatsApp">💬</a>
        </div>
      </div>${openId[t.id] ? months(t.id) : ''}</div>`;
  };
  $('list').innerHTML = list.length ? groupByCat(list).map((arr, i) => arr.length
    ? `<div class="sec">${CATS[i]} <span>${bn(arr.length)} জন</span></div>` + arr.map(card).join('') : '').join('')
    : '<div class="empty">কোনো শিক্ষক পাওয়া যায়নি</div>';
}

// প্রক্সি যিনি করেছেন তার আইডির সম্ভাব্য ফিল্ড (আপনার ডাটায় যেটা আছে সেটা ধরবে)
const PROXY_FIELDS = ['proxyId','proxyTeacherId','subId','substituteId','proxyTeacher','teacherId','byId','newId','toId'];
function proxyOf(p){ for (const f of PROXY_FIELDS) if (p[f] && p[f] !== p.absentId) return p[f]; return null; }
function loadMissed(){
  $('yl').textContent = bn(Y) + ' সাল (জানুয়ারি – ডিসেম্বর)';
  const yy = Y;
  db.collection('proxies').where('date', '>=', yy + '-01-01').where('date', '<=', yy + '-12-31').get().then(q => {
    if (yy !== Y) return;
    missed = {};
    const get = id => missed[id] = missed[id] || {m: Array(12).fill(0), total: 0, pm: Array(12).fill(0), ptotal: 0};
    q.docs.forEach(d => { const p = d.data();
      const mi = parseInt(String(p.date).slice(5, 7), 10) - 1;
      if (mi < 0 || mi > 11) return;
      if (p.absentId) { const a = get(p.absentId); a.m[mi]++; a.total++; }
      const pid = proxyOf(p);
      if (pid) { const b = get(pid); b.pm[mi]++; b.ptotal++; } });
    render();
  }).catch(e => console.error(e));
}
var unsubT = null;
function startT(){
  loadMissed();
  unsubT = db.collection('teachers').orderBy('name').onSnapshot(s => {
  teachers = s.docs.map(d => ({id:d.id, ...d.data()}));
  render();
}, e => $('list').innerHTML = '<div class="empty">লোড করা যায়নি<br><span class="mu">' + esc(e.code || '') + ' ' + esc(e.message) + '</span></div>');
}
auth.onAuthStateChanged(u => {
  if (unsubT) { unsubT(); unsubT = null; }
  teachers = []; missed = {};
  $('need').classList.toggle('hide', !!u);
  $('main').classList.toggle('hide', !u);
  if (u) startT();
});
</script>
