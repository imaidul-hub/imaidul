<!DOCTYPE html>
<html lang="bn">
<head>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষক পোর্টাল</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#17241c;--mu:#62736a;--pr:#0f7a4a;--pr2:#0b5c37;--gd:#c9a227;--bd:#dbe7df;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--card:#16231b;--tx:#e6f0ea;--mu:#94a89c;--pr:#34b57a;--pr2:#0b5c37;--bd:#254033}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}
.bar{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.bar a,.bar button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;margin-left:6px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
input,button.act{font:inherit;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:4px 0}
button.act{background:var(--pr);color:#fff;border:0;cursor:pointer;font-weight:700}
button.sec{background:var(--mu)!important}
.hello{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;border-radius:14px;padding:16px;margin-bottom:10px}
.hello b{font-size:19px}
.hello div{opacity:.9;font-size:14px}
h2{font-size:17px;margin:16px 0 8px;color:var(--pr);border-right:4px solid var(--gd);padding-right:8px}
.it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}
.it:last-child{border:0}
.pn{background:var(--pr);color:#fff;border-radius:10px;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mine{border:2px solid var(--pr)}
.mu{color:var(--mu);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:14px}
#toast{position:fixed;left:10px;right:10px;top:58px;z-index:99;max-width:600px;margin:0 auto;padding:12px 40px 12px 14px;border-radius:12px;color:#fff;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.err{background:#b42318}#toast.ok{background:#0f7a4a}
#toast button{position:absolute;right:8px;top:6px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.hide{display:none}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--bd)}
.rtt{border-collapse:collapse;width:100%;min-width:0;font-size:11.5px;text-align:center;animation:rtin .3s ease both}
.rtt th,.rtt td{border:1px solid var(--bd);padding:3px 2px;vertical-align:middle;line-height:1.35}
.rtt thead th{background:var(--pr);color:#fff;font-weight:700;white-space:nowrap}
.rtt thead th:first-child{position:sticky;left:0;z-index:1}
.rtt thead th.td{background:var(--gd);color:#2b2200}
.rtt tbody th{background:var(--bg);color:var(--pr);position:sticky;left:0;white-space:nowrap;min-width:0}
.rtt thead th small{display:block;font-weight:400;font-size:9.5px;opacity:.9}
.rtt tbody th.td{background:var(--gd);color:#2b2200}
.rtt tbody th small{display:block;color:var(--mu);font-weight:400;font-size:10.5px}
.rtt td.td{background:rgba(201,162,39,.14)}
.rtt td b{display:block;color:var(--tx)}
.rtt td span{color:var(--mu);font-size:10.5px}
.rtt td.e{color:var(--mu)}
.rtmeta{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
@keyframes rtin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
<style id="sl-css">
#sl{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f4f8f5;transition:opacity .45s ease,visibility .45s ease}
#sl.sl-out{opacity:0;visibility:hidden;pointer-events:none}
#sl .sl-ring{width:54px;height:54px;border-radius:50%;border:4px solid rgba(15,122,74,.18);border-top-color:#0f7a4a;border-right-color:#c9a227;animation:sl-spin .9s cubic-bezier(.5,.1,.5,.9) infinite}
#sl .sl-txt{font:600 14px "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;color:#0f7a4a;animation:sl-pulse 1.4s ease-in-out infinite}
#sl-bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:100000;background:linear-gradient(90deg,#0f7a4a,#c9a227);box-shadow:0 0 8px rgba(15,122,74,.5);transition:width .35s ease,opacity .3s ease}
body{animation:sl-fade .5s ease both}
body.sl-leave{opacity:0;transition:opacity .18s ease}
@keyframes sl-spin{to{transform:rotate(360deg)}}
@keyframes sl-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sl-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-color-scheme:dark){#sl{background:#0e1712}#sl .sl-ring{border-color:rgba(52,181,122,.2);border-top-color:#34b57a}#sl .sl-txt{color:#34b57a}}
@media(prefers-reduced-motion:reduce){#sl .sl-ring,#sl .sl-txt,body{animation:none}}
</style>
</head>
<body>
<div id="sl" role="status" aria-live="polite"><div class="sl-ring"></div><div class="sl-txt">লোড হচ্ছে...</div></div><div id="sl-bar"></div>
<div class="bar"><b>👨‍🏫 শিক্ষক পোর্টাল</b><div><a href="index.html">হোম</a><button id="out" class="hide" onclick="auth.signOut()">লগআউট</button></div></div>
<div id="toast" class="hide"><span id="tmsg"></span><button onclick="$('toast').classList.add('hide')">×</button></div>

<div class="wrap">
  <!-- লগইন -->
  <div id="login" class="card" style="margin-top:30px">
    <h3 style="margin-top:0">🔐 শিক্ষক লগইন</h3>
    <input id="ph" type="tel" inputmode="numeric" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" autocomplete="username">
    <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="act" onclick="login()">লগইন</button>
    <div class="mu">পাসওয়ার্ড না জানলে মাদ্রাসা অফিসে যোগাযোগ করুন।</div>
  </div>

  <!-- হোম -->
  <div id="home" class="hide">
    <div class="hello"><b id="hi">স্বাগতম</b><div id="dt"></div></div>

    <h2>📅 আপনার সাপ্তাহিক ক্লাস রুটিন</h2>
    <div class="card">
      <div class="rtmeta mu"><span>রবিবার থেকে বৃহস্পতিবার</span><span id="rtCount"></span></div>
      <div class="tblw"><table class="rtt" id="rtT"></table></div>
    </div>

    <h2>🔁 আপনার আজকের প্রক্সি</h2>
    <div class="card mine" id="mine"></div>

    <h2>আজকের সব প্রক্সি তালিকা</h2>
    <div class="card" id="all"></div>

    <div class="card">
      <a href="proxy.html" style="color:var(--pr)">📄 সপ্তাহের প্রক্সি রিপোর্ট দেখুন</a>
    </div>

    <h2>পাসওয়ার্ড পরিবর্তন</h2>
    <div class="card">
      <input id="np" type="password" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password">
      <button class="act sec" onclick="changePw()">পরিবর্তন করুন</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCDjI1t2EnJKmvAV3hbz-sjir8YW8IfOQg",
  authDomain: "mmmmg-d02b8.firebaseapp.com",
  projectId: "mmmmg-d02b8",
  storageBucket: "mmmmg-d02b8.firebasestorage.app",
  messagingSenderId: "1001193607775",
  appId: "1:1001193607775:web:c4539574a49cddf59341ea"
});
const auth = firebase.auth(), db = firebase.firestore();
// ⚡ দ্রুত ও স্থিতিশীল লোডিং: ধীর/ব্লকড নেটওয়ার্কে স্বয়ংক্রিয় long-polling + অফলাইন ক্যাশ
try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
const $ = id => document.getElementById(id);
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const ds = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const normPhone = p => { let d = String(p||'').replace(/\D/g,''); if (d.startsWith('880')) d = d.slice(3); if (d.length === 10 && d[0] === '1') d = '0' + d; return d; };
const phoneEmail = p => normPhone(p) + '@madrasa-teacher.app';

// ---- মেসেজ ----
var toastT = null;
function showMsg(text, type){
  const t = $('toast'); $('tmsg').textContent = text; t.className = type === 'ok' ? 'ok' : 'err';
  clearTimeout(toastT); if (type === 'ok') toastT = setTimeout(() => t.classList.add('hide'), 3000);
}
const ERR = {
  'auth/invalid-credential': 'মোবাইল নম্বর বা পাসওয়ার্ড ভুল।',
  'auth/wrong-password': 'পাসওয়ার্ড ভুল।',
  'auth/user-not-found': 'এই নম্বরে লগইন তৈরি করা হয়নি। অফিসে যোগাযোগ করুন।',
  'auth/too-many-requests': 'অনেকবার ভুল চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।',
  'auth/network-request-failed': 'ইন্টারনেট সংযোগে সমস্যা।',
  'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',
  'auth/requires-recent-login': 'লগআউট করে আবার লগইন করে চেষ্টা করুন।',
  'auth/unauthorized-domain': 'এই ডোমেইন Firebase এ অনুমোদিত নয়।',
  'permission-denied': 'অনুমতি নেই। Firestore Rules দেখুন।',
  'unavailable': 'সার্ভারের সাথে সংযোগ হচ্ছে না।'
};
function fail(e){
  const c = (e && e.code) || 'error', m = (e && e.message) || String(e);
  console.error(e); showMsg('❌ ' + (ERR[c] || 'সমস্যা হয়েছে।') + '\n[' + c + '] ' + m, 'err');
}

// ---- লগইন ----
function login(){
  const p = normPhone($('ph').value);
  if (!/^01\d{9}$/.test(p)) return showMsg('সঠিক মোবাইল নম্বর দিন (১১ সংখ্যা, 01 দিয়ে শুরু)');
  if (!$('pw').value) return showMsg('পাসওয়ার্ড দিন');
  auth.signInWithEmailAndPassword(phoneEmail(p), $('pw').value).catch(fail);
}
function changePw(){
  const v = $('np').value;
  if (v.length < 6) return showMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');
  auth.currentUser.updatePassword(v).then(() => { $('np').value = ''; showMsg('✅ পাসওয়ার্ড বদলানো হয়েছে', 'ok'); }).catch(fail);
}

// ---- ডাটা ----
var teachers = [], proxies = [], me = null, unsubP = null, unsubT = null, day = ds(new Date());
const tName = id => (teachers.find(t => t.id === id) || {}).name || '—';

function myPhone(){ const u = auth.currentUser; return u && u.email ? normPhone(u.email.split('@')[0]) : ''; }
function findMe(){ const p = myPhone(); me = teachers.find(t => normPhone(t.phone) === p) || null; }

function item(p, mine){
  return `<div class="it"><div class="pn">${bn(p.period)}</div>
    <div><b>${esc(p.class)}</b> — ${esc(p.subject)}
    <div class="mu">${mine ? '' : esc(tName(p.subId)) + ' • '}${p.absentId ? esc(tName(p.absentId)) + '-এর পরিবর্তে' : 'প্রক্সি'}${p.room ? ' • রুম ' + esc(p.room) : ''}</div></div></div>`;
}
function render(){
  findMe(); watchRoutine(); renderRt();
  const d = new Date();
  $('dt').textContent = DAYS[d.getDay()] + ', ' + bn(ds(d));
  $('hi').textContent = me ? 'আসসালামু আলাইকুম, ' + me.name : 'আসসালামু আলাইকুম';
  const list = proxies.slice().sort((a,b) => a.period - b.period);
  const mine = me ? list.filter(p => p.subId === me.id) : [];
  $('mine').innerHTML = !me ? '<div class="empty">এই নম্বর শিক্ষক তালিকায় পাওয়া যায়নি</div>'
    : mine.length ? mine.map(p => item(p, true)).join('') : '<div class="empty">আজ আপনার কোনো প্রক্সি নেই 🎉</div>';
  $('all').innerHTML = list.length ? list.map(p => item(p, false)).join('') : '<div class="empty">আজ কোনো প্রক্সি নেই</div>';
}
function startData(){
  stopData();
  day = ds(new Date());
  unsubT = db.collection('teachers').onSnapshot(s => { teachers = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail);
  unsubP = db.collection('proxies').where('date','==',day).onSnapshot(s => { proxies = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail);
}
function stopData(){ if (unsubT) { unsubT(); unsubT = null; } if (unsubP) { unsubP(); unsubP = null; } if (unsubR) { unsubR(); unsubR = null; } rtFor = null; myRt = []; }

// ---- সাপ্তাহিক ক্লাস রুটিন (প্রথম কলামে রবি → বৃহস্পতি) ----
var myRt = [], unsubR = null, rtFor = null;
const WEEK = [0,1,2,3,4];
const fmtT = t => { if (!t) return ''; const a = String(t).split(':').map(Number); let h = a[0], m = a[1] || 0; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return bn(h + ':' + String(m).padStart(2,'0')) + ' ' + ap; };
function watchRoutine(){
  if (!me || rtFor === me.id) return;
  if (unsubR) unsubR();
  rtFor = me.id; myRt = [];
  unsubR = db.collection('routines').where('teacherId','==',me.id).onSnapshot(s => {
    myRt = s.docs.map(d => ({id:d.id, ...d.data()})); renderRt();
  }, fail);
}
function renderRt(){
  const t = $('rtT'); if (!t) return;
  if (!me) { t.innerHTML = '<tbody><tr><td class="e" style="padding:14px">এই নম্বর শিক্ষক তালিকায় পাওয়া যায়নি</td></tr></tbody>'; $('rtCount').textContent = ''; return; }
  $('rtCount').textContent = 'মোট ' + bn(myRt.length) + 'টি ক্লাস';
  if (!myRt.length) { t.innerHTML = '<tbody><tr><td class="e" style="padding:14px">আপনার কোনো ক্লাস রুটিন এখনো দেওয়া হয়নি</td></tr></tbody>'; return; }
  const today = new Date().getDay();
  const periods = [1,2,3,4,5,6,7,8];
  const pinfo = pr => { const any = myRt.find(r => r.period === pr && r.start); return any ? '<small>' + fmtT(any.start) + (any.end ? '–' + fmtT(any.end) : '') + '</small>' : ''; };
  const thead = '<thead><tr><th>বার</th>' + periods.map(pr => '<th>' + bn(pr) + '<small>পিরিয়ড</small>' + pinfo(pr) + '</th>').join('') + '</tr></thead>';
  const tbody = '<tbody>' + WEEK.map(d => {
    const isT = d === today;
    const cells = periods.map(pr => {
      const rs = myRt.filter(r => r.day === d && r.period === pr);
      return rs.length ? '<td' + (isT ? ' class="td"' : '') + '>' + rs.map(r => '<b>' + esc(r.class) + '</b><span>' + esc(r.subject) + (r.room ? ' • রুম ' + esc(r.room) : '') + '</span>').join('<hr style="border:0;border-top:1px dashed var(--bd);margin:4px 0">') + '</td>' : '<td class="e' + (isT ? ' td' : '') + '">–</td>';
    }).join('');
    return '<tr><th' + (isT ? ' class="td"' : '') + '>' + DAYS[d] + '</th>' + cells + '</tr>';
  }).join('') + '</tbody>';
  t.innerHTML = thead + tbody;
}

auth.onAuthStateChanged(u => {
  $('login').classList.toggle('hide', !!u); $('home').classList.toggle('hide', !u); $('out').classList.toggle('hide', !u);
  if (u) startData(); else { stopData(); proxies = []; me = null; }
});
// তারিখ বদলালে (রাত ১২টার পর) নতুন দিনের তালিকা
setInterval(() => { if (auth.currentUser && ds(new Date()) !== day) startData(); }, 60000);
</script>
<script id="sl-js">
(function(){
  var sl=document.getElementById('sl'),bar=document.getElementById('sl-bar'),done=false,w=8,t0=Date.now();
  if(!sl)return;
  bar.style.width=w+'%';
  var iv=setInterval(function(){w+=(90-w)*.08;bar.style.width=w+'%';},250);
  function hide(){
    if(done)return;done=true;clearInterval(iv);
    var wait=Math.max(0,350-(Date.now()-t0));
    setTimeout(function(){
      bar.style.width='100%';
      sl.classList.add('sl-out');
      setTimeout(function(){bar.style.opacity='0';},250);
      setTimeout(function(){sl.remove();bar.remove();},700);
    },wait);
  }
  var loaded=document.readyState==='complete',authed=false;
  function check(){if(loaded&&authed)hide();}
  window.addEventListener('load',function(){loaded=true;check();});
  try{firebase.auth().onAuthStateChanged(function(){authed=true;check();},function(){authed=true;check();});}catch(e){authed=true;}
  setTimeout(hide,6000);
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||a.target==='_blank'||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)==='#'||/^(javascript|mailto|tel|blob|data):/i.test(h)||a.hasAttribute('download'))return;
    if(a.origin&&a.origin!==location.origin)return;
    document.body.classList.add('sl-leave');
  });
  window.addEventListener('pageshow',function(e){if(e.persisted)document.body.classList.remove('sl-leave');});
})();
</script>
</body>
</html>
